<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - AI Resume Builder</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .profile-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .profile-header {
            margin-bottom: 30px;
        }

        .profile-header h1 {
            margin-bottom: 8px;
        }

        .profile-header p {
            color: #777;
        }

        .profile-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 30px;
        }

        .profile-image {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #4f46e5;
        }

        .profile-info h2 {
            margin-bottom: 5px;
        }

        .profile-info p {
            color: #777;
            margin: 5px 0;
        }

        .upload-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 15px;
            background: #4f46e5;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .upload-btn:hover {
            background: #3730a3;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .form-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 11px 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
        }

        .btn-primary:hover {
            background: #3730a3;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .section-title {
            margin-bottom: 20px;
            font-size: 21px;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            display: none;
            border-radius: 6px;
            background: #dcfce7;
            color: #166534;
        }

        .danger-zone {
            border: 1px solid #fecaca;
            background: #fffafa;
        }

        .danger-zone h2 {
            color: #dc2626;
        }

        .logout-btn {
            background: #dc2626;
            color: white;
        }

        .logout-btn:hover {
            background: #b91c1c;
        }

        @media (max-width: 600px) {
            .profile-container {
                margin: 20px auto;
                padding: 15px;
            }

            .profile-card {
                padding: 20px;
            }

            .profile-top {
                flex-direction: column;
                text-align: center;
            }

            .form-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            AI Resume Builder
        </div>

        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="resume-builder.html">Create Resume</a>
            <a href="profile.html" class="active">Profile</a>
            <a href="settings.html">Settings</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>

    </nav>


    <!-- Profile Container -->
    <main class="profile-container">

        <div class="profile-header">
            <h1>My Profile</h1>
            <p>Manage your personal information and account details.</p>
        </div>


        <!-- Profile Information -->
        <div class="profile-card">

            <div class="profile-top">

                <div>
                    <img
                        id="profileImage"
                        class="profile-image"
                        src="https://via.placeholder.com/110"
                        alt="Profile Picture"
                    >

                    <br>

                    <label for="imageUpload" class="upload-btn">
                        Change Picture
                    </label>

                    <input
                        type="file"
                        id="imageUpload"
                        accept="image/*"
                        style="display:none;"
                    >
                </div>

                <div class="profile-info">
                    <h2 id="displayName">Your Name</h2>
                    <p id="displayEmail">your@email.com</p>
                    <p>Resume Builder User</p>
                </div>

            </div>

        </div>


        <!-- Edit Profile -->
        <div class="profile-card">

            <h2 class="section-title">Edit Profile</h2>

            <form id="profileForm">

                <div class="form-group">
                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                    >
                </div>


                <div class="form-buttons">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Changes
                    </button>

                    <button
                        type="button"
                        class="btn btn-secondary"
                        onclick="loadProfile()"
                    >
                        Cancel
                    </button>

                </div>

                <div id="profileMessage" class="message">
                    Profile updated successfully!
                </div>

            </form>

        </div>


        <!-- Change Password -->
        <div class="profile-card">

            <h2 class="section-title">
                Change Password
            </h2>

            <form id="passwordForm">

                <div class="form-group">
                    <label for="currentPassword">
                        Current Password
                    </label>

                    <input
                        type="password"
                        id="currentPassword"
                        placeholder="Enter current password"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        required
                    >
                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Update Password
                </button>

                <div id="passwordMessage" class="message"></div>

            </form>

        </div>


        <!-- Account Section -->
        <div class="profile-card danger-zone">

            <h2 class="section-title">
                Account
            </h2>

            <p>
                Sign out from your AI Resume Builder account.
            </p>

            <button
                class="btn logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </main>


    <!-- JavaScript -->
    <script>

        // Check login
        if (localStorage.getItem("resumeAILoggedIn") !== "true") {
            window.location.href = "login.html";
        }


        // Load profile when page opens
        document.addEventListener("DOMContentLoaded", function () {
            loadProfile();
        });


        // Load saved profile
        function loadProfile() {

            const savedProfile =
                JSON.parse(localStorage.getItem("resumeAIProfile")) || {};

            const name =
                savedProfile.name || "Your Name";

            const email =
                savedProfile.email || "your@email.com";

            const phone =
                savedProfile.phone || "";


            document.getElementById("name").value = name;
            document.getElementById("email").value = email;
            document.getElementById("phone").value = phone;

            document.getElementById("displayName").textContent = name;
            document.getElementById("displayEmail").textContent = email;


            // Load saved profile image
            if (savedProfile.image) {
                document.getElementById("profileImage").src =
                    savedProfile.image;
            }
        }


        // Save profile
        document
            .getElementById("profileForm")
            .addEventListener("submit", function (event) {

                event.preventDefault();

                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const phone =
                    document.getElementById("phone").value.trim();


                const oldProfile =
                    JSON.parse(localStorage.getItem("resumeAIProfile")) || {};


                const profile = {
                    name: name,
                    email: email,
                    phone: phone,
                    image: oldProfile.image || ""
                };


                localStorage.setItem(
                    "resumeAIProfile",
                    JSON.stringify(profile)
                );


                document.getElementById("displayName").textContent = name;
                document.getElementById("displayEmail").textContent = email;


                const message =
                    document.getElementById("profileMessage");

                message.style.display = "block";

                setTimeout(function () {
                    message.style.display = "none";
                }, 3000);

            });


        // Profile image upload
        document
            .getElementById("imageUpload")
            .addEventListener("change", function (event) {

                const file = event.target.files[0];

                if (!file) {
                    return;
                }


                const reader = new FileReader();


                reader.onload = function () {

                    const imageData = reader.result;

                    document.getElementById("profileImage").src =
                        imageData;


                    const profile =
                        JSON.parse(
                            localStorage.getItem("resumeAIProfile")
                        ) || {};


                    profile.image = imageData;


                    localStorage.setItem(
                        "resumeAIProfile",
                        JSON.stringify(profile)
                    );
                };


                reader.readAsDataURL(file);

            });


        // Change password
        document
            .getElementById("passwordForm")
            .addEventListener("submit", function (event) {

                event.preventDefault();


                const currentPassword =
                    document.getElementById("currentPassword").value;

                const newPassword =
                    document.getElementById("newPassword").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;


                const message =
                    document.getElementById("passwordMessage");


                if (newPassword !== confirmPassword) {

                    message.textContent =
                        "New passwords do not match.";

                    message.style.background = "#fee2e2";
                    message.style.color = "#991b1b";
                    message.style.display = "block";

                    return;
                }


                if (newPassword.length < 6) {

                    message.textContent =
                        "Password must contain at least 6 characters.";

                    message.style.background = "#fee2e2";
                    message.style.color = "#991b1b";
                    message.style.display = "block";

                    return;
                }


                // Demo password storage
                localStorage.setItem(
                    "resumeAIPassword",
                    newPassword
                );


                message.textContent =
                    "Password updated successfully!";

                message.style.background = "#dcfce7";
                message.style.color = "#166534";
                message.style.display = "block";


                document.getElementById("passwordForm").reset();


                setTimeout(function () {
                    message.style.display = "none";
                }, 3000);

            });


        // Logout
        function logout() {

            localStorage.removeItem("resumeAILoggedIn");

            window.location.href = "login.html";
        }

    </script>

</body>
</html>
