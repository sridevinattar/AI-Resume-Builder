<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - ResumeAI</title>


    <style>

        /* ========================================
           RESET
        ======================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            min-height: 100vh;

            background: #f5f7fb;

            font-family: Arial, Helvetica, sans-serif;

            color: #1f2937;
        }


        /* ========================================
           HEADER
        ======================================== */

        .forgot-header {
            width: 100%;
            height: 72px;

            background: #ffffff;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            border-bottom: 1px solid #e5e7eb;
        }


        .forgot-logo {
            text-decoration: none;

            font-size: 27px;

            font-weight: 700;

            color: #111827;
        }


        .forgot-logo span {
            color: #6c63ff;
        }


        .back-home {
            color: #64748b;

            text-decoration: none;

            font-size: 15px;

            transition: 0.3s;
        }


        .back-home:hover {
            color: #6c63ff;
        }


        /* ========================================
           MAIN
        ======================================== */

        .forgot-main {
            width: 100%;

            min-height: calc(100vh - 132px);

            display: flex;

            justify-content: center;

            align-items: flex-start;

            padding: 70px 20px;
        }


        /* ========================================
           CARD
        ======================================== */

        .forgot-card {
            width: 100%;

            max-width: 450px;

            background: #ffffff;

            padding: 40px;

            border-radius: 14px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.08);
        }


        /* ========================================
           ICON
        ======================================== */

        .forgot-icon {
            width: 60px;
            height: 60px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #eeecff;

            color: #6c63ff;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 27px;
        }


        /* ========================================
           HEADING
        ======================================== */

        .forgot-heading {
            text-align: center;

            margin-bottom: 28px;
        }


        .forgot-heading h1 {
            font-size: 29px;

            color: #111827;

            margin-bottom: 10px;
        }


        .forgot-heading p {
            color: #64748b;

            font-size: 15px;

            line-height: 1.6;
        }


        /* ========================================
           MESSAGE
        ======================================== */

        #authMessage {
            display: none;

            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            border-radius: 7px;

            font-size: 14px;
        }


        /* ========================================
           FORM
        ======================================== */

        .forgot-group {
            width: 100%;

            margin-bottom: 20px;
        }


        .forgot-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;

            color: #1f2937;
        }


        /* ========================================
           EMAIL INPUT
        ======================================== */

        .forgot-input {
            width: 100%;

            height: 50px;

            padding: 0 14px;

            border: 1px solid #d5dae3;

            border-radius: 8px;

            outline: none;

            background: #ffffff;

            color: #1f2937;

            font-size: 15px;
        }


        .forgot-input:focus {
            border-color: #6c63ff;

            box-shadow:
                0 0 0 3px rgba(108, 99, 255, 0.10);
        }


        .forgot-input::placeholder {
            color: #9ca3af;
        }


        /* ========================================
           BUTTON
        ======================================== */

        .forgot-button {
            width: 100%;

            height: 50px;

            margin-top: 5px;

            border: none;

            border-radius: 8px;

            background: #6c63ff;

            color: #ffffff;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }


        .forgot-button:hover {
            background: #574fd6;

            transform: translateY(-1px);
        }


        /* ========================================
           BACK TO LOGIN
        ======================================== */

        .login-link {
            text-align: center;

            margin-top: 24px;

            font-size: 14px;

            color: #64748b;
        }


        .login-link a {
            color: #6c63ff;

            text-decoration: none;

            font-weight: 600;
        }


        .login-link a:hover {
            text-decoration: underline;
        }


        /* ========================================
           FOOTER
        ======================================== */

        .forgot-footer {
            width: 100%;

            height: 60px;

            background: #ffffff;

            border-top: 1px solid #e5e7eb;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .forgot-footer p {
            color: #64748b;

            font-size: 13px;
        }


        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 600px) {

            .forgot-header {
                padding: 0 20px;
            }


            .forgot-logo {
                font-size: 23px;
            }


            .back-home {
                font-size: 13px;
            }


            .forgot-main {
                padding: 40px 15px;
            }


            .forgot-card {
                padding: 30px 22px;
            }


            .forgot-heading h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- ========================================
         HEADER
    ======================================== -->

    <header class="forgot-header">

        <a
            href="index.html"
            class="forgot-logo"
        >
            Resume<span>AI</span>
        </a>


        <a
            href="index.html"
            class="back-home"
        >
            ← Back to Home
        </a>

    </header>



    <!-- ========================================
         MAIN
    ======================================== -->

    <main class="forgot-main">

        <div class="forgot-card">


            <!-- Icon -->

            <div class="forgot-icon">
                🔑
            </div>


            <!-- Heading -->

            <div class="forgot-heading">

                <h1>
                    Forgot Password?
                </h1>

                <p>
                    Enter your registered email address
                    to reset your password.
                </p>

            </div>


            <!-- Message -->

            <div id="authMessage"></div>


            <!-- Form -->

            <form id="forgotPasswordForm">


                <div class="forgot-group">

                    <label for="email">
                        Email Address
                    </label>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="forgot-input"
                        placeholder="Enter your registered email"
                        required
                    >

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="forgot-button"
                >
                    Reset Password
                </button>

            </form>


            <!-- Login -->

            <div class="login-link">

                Remember your password?

                <a href="login.html">
                    Back to Login
                </a>

            </div>

        </div>

    </main>



    <!-- ========================================
         FOOTER
    ======================================== -->

    <footer class="forgot-footer">

        <p>
            © 2026 ResumeAI. All Rights Reserved.
        </p>

    </footer>



    <!-- ========================================
         JAVASCRIPT
    ======================================== -->

    <script src="js/auth.js"></script>


</body>

</html>
